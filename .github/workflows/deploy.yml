name: 🚀 Deploy to AWS S3 (freetalk.at)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@v4

      - name: 📦 Install or Update AWS CLI (v2)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip
          if ! command -v aws &> /dev/null
          then
            echo "Installing AWS CLI v2..."
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip awscliv2.zip
            sudo ./aws/install
          else
            echo "AWS CLI already installed, upgrading..."
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip awscliv2.zip
            sudo ./aws/install --update
          fi

      - name: 🌍 Deploy to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          echo "🚀 Deploying to freetalk-at..."

          # ✅ HTML 외 모든 정적 파일(js, css, img 등)을 1년 캐시로 업로드
          aws s3 sync . s3://freetalk-at \
            --region $AWS_REGION \
            --delete \
            --cache-control "max-age=31536000" \
            --metadata-directive REPLACE \
            --exclude "*.html" \
            --exclude ".git/*" \
            --exclude ".github/*"

          # ✅ HTML은 짧은 캐시(60초)로 별도 업로드
          aws s3 sync . s3://freetalk-at \
            --region $AWS_REGION \
            --delete \
            --cache-control "max-age=60" \
            --metadata-directive REPLACE \
            --exclude "*" --include "*.html"

          # ✅ S3 정적 웹사이트 설정
          aws s3 website s3://freetalk-at --index-document index.html --error-document 404.html

          echo "✅ Deploy complete!"
